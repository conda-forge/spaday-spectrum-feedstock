context:
  version: "0.4.0"

package:
  name: spaday-spectrum
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-spectrum/spaday_spectrum-${{ version }}.tar.gz
  sha256: f284d69c7ce5870e303f8ecdbd7a76d198b0f2006531cdd96ae0a22cc674376a

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.10.0,<1

tests:
  - python:
      imports:
        - spaday_spectrum
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Spectrum components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-spectrum
  repository: https://github.com/1kbgz/spaday-spectrum

extra:
  recipe-maintainers:
    - timkpaine
